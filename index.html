<style>
  :root{
    --cream:#FFF8E7; --bej:#F5E6D3;
    --gold:#D4AF37; --gold-deep:#B8941F; --gold-soft:#E4C868;
    --brown:#3E2723; --brown-mid:#6D4C41;
    --syrup:#C9781E;
    --line:rgba(62,39,35,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
  body{font-family:'Figtree',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--brown);
       -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
  body.locked{overflow:hidden}
  .serif{font-family:'Cormorant Garamond',Georgia,serif}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px;border-radius:6px}

  /* ================= AÇILIŞ EKRANI ================= */
  #splash{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column;
          align-items:center;justify-content:center;text-align:center;
          padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));
          overflow:hidden;transition:opacity .55s ease, transform .7s cubic-bezier(.7,0,.2,1)}
  #splash.out{opacity:0;transform:translateY(-6%) scale(1.04);pointer-events:none}
  .strands{position:absolute;inset:-10% -10% auto;height:48%;width:120%;opacity:.5;pointer-events:none}
  .strands.bottom{inset:auto -10% -10%;transform:scaleY(-1)}
  .strands path{fill:none;stroke:var(--gold-soft);stroke-width:1.1}
  .sp-inner{position:relative;max-width:360px}
  .logo-wrap{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;border:2px solid var(--gold);
             overflow:hidden;background:var(--bej);display:grid;place-items:center}
  .logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  /* gerçek logo yüklenince: çember yok, logo tek başına */
  .logo-wrap.has-img{border:none;border-radius:0;background:none;overflow:visible;width:auto;max-width:220px;height:110px}
  .logo-wrap.has-img img{width:auto;height:100%;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
  header .logo-wrap.has-img{width:auto;max-width:160px;height:72px}
  .logo-wrap .mono{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:48px;color:var(--gold-deep);line-height:1}
  .sp-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:44px;line-height:1}
  .sp-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:22px;color:var(--gold-deep);margin-top:4px}
  .sp-city{margin-top:10px;font-size:13px;letter-spacing:.14em;color:var(--brown-mid)}
  .rule{width:60px;height:2px;background:var(--gold);margin:20px auto 0;border-radius:2px}
  .ask{margin-top:22px;font-size:14px;line-height:1.75;color:var(--brown-mid)}
  .flags{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
  .flag{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 10px 13px;border-radius:16px;
        background:#fff;border:1px solid var(--line);cursor:pointer;transition:transform .15s, border-color .15s}
  .flag:active{transform:scale(.96)}
  .flag.picked{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.25)}
  .flag svg{width:54px;height:36px;border-radius:4px;box-shadow:0 1px 3px rgba(62,39,35,.25);display:block}
  .flag span{font-weight:600;font-size:15px}

  /* ================= ÜST BAŞLIK ================= */
  .wrap{max-width:640px;margin:0 auto;padding:0 20px 56px}
  header{text-align:center;padding:calc(26px + env(safe-area-inset-top,0px)) 0 4px}
  header .logo-wrap{width:64px;height:64px;margin-bottom:10px}
  header .logo-wrap .mono{font-size:32px}
  .h-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:32px;line-height:1.05}
  .h-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:18px;color:var(--gold-deep)}
  .langs{display:flex;justify-content:center;gap:6px;margin:16px 0 0}
  .langs button{font-size:13px;font-weight:600;letter-spacing:.06em;padding:7px 15px;border-radius:999px;
                border:1px solid var(--line);background:transparent;color:var(--brown-mid);cursor:pointer}
  .langs button.active{background:var(--brown);color:var(--cream);border-color:var(--brown)}

  /* ================= KATEGORİ SEKMELERİ ================= */
  .tabs{position:sticky;top:0;z-index:10;background:var(--cream);
        border-bottom:1px solid var(--line);margin-top:18px;padding-top:env(safe-area-inset-top,0px)}
  .tabs-in{max-width:640px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
  .tabs-in::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;white-space:nowrap;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;
       border:none;background:transparent;color:var(--brown-mid);cursor:pointer;transition:background .2s,color .2s}
  .tab.on{background:var(--bej);color:var(--brown)}

  /* ================= BÖLÜMLER ================= */
  section{margin-top:36px}
  .sec-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;display:flex;align-items:center;gap:14px}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .sec-note{font-size:14px;color:var(--brown-mid);margin-top:4px;line-height:1.5}

  /* ürünler: telefonda ikili ızgara */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
  @media (min-width:560px){ .grid{gap:16px} }
  .card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .thumb{position:relative;aspect-ratio:1/1;background:var(--bej);display:grid;place-items:center}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card{contain:layout paint}
  .thumb .mono{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:46px;color:var(--gold-deep);opacity:.55}
  .thumb .badge,.thumb .sold-tag{position:absolute;top:8px;left:8px;margin:0}
  .info{display:flex;flex-direction:column;flex:1;padding:10px 11px 12px}
  .name{font-weight:600;font-size:14.5px;line-height:1.28}
  .desc{font-size:12.5px;color:var(--brown-mid);margin-top:3px;line-height:1.4}
  .price{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap}
  .info .price{margin-top:auto;padding-top:8px}
  .badge{display:inline-block;font-size:11px;font-weight:600;color:var(--gold-deep);background:var(--cream);
         border:1px solid var(--gold-soft);border-radius:999px;padding:2px 9px}

  /* künefe kişilik fiyatları: kartın altında satır satır */
  .sizes{margin-top:auto;padding-top:8px;display:flex;flex-direction:column}
  .size{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;color:var(--brown-mid);
        padding:4px 0;border-top:1px dashed var(--line)}
  .size b{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--brown);font-weight:700;margin-right:3px}
  .size i{font-style:normal;font-weight:600;color:var(--syrup);white-space:nowrap}
  .sizes.bare{font-size:12.5px;color:var(--brown-mid)}

  /* içecek listesi */
  .row{display:flex;align-items:baseline;gap:10px;padding:13px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .row .name{font-size:15px}
  .dots{flex:1;border-bottom:1.5px dotted rgba(62,39,35,.28);transform:translateY(-4px);min-width:24px}
  .row .price{font-size:18px}

  /* tükendi */
  .sold{opacity:.5}
  .card.sold{opacity:1}
  .card.sold img,.card.sold .mono,.card.sold .info{opacity:.45}
  .card.sold .thumb{filter:grayscale(.7)}
  .sold .name{text-decoration:line-through;text-decoration-color:rgba(62,39,35,.4)}
  .sold-tag{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--brown-mid);
            border-radius:999px;padding:2px 9px;margin-top:6px;opacity:1}

  footer{margin-top:44px;text-align:center;font-size:13px;color:var(--brown-mid);line-height:1.9}
  footer a{color:var(--brown);text-decoration:none;font-weight:600}
  .foot-rule{width:38px;height:1px;background:var(--gold);margin:0 auto 14px}

  #app{opacity:0;transition:opacity .6s ease .15s}
  #app.in{opacity:1}

  @media (prefers-reduced-motion: reduce){
    #splash,#app{transition:none}
  }
</style>
</head>

          <circle cx="23" cy="20" r="9" fill="#fff"/>
          <circle cx="26.5" cy="20" r="7.2" fill="#E30A17"/>
          <path fill="#fff" d="M38.2 13.6l1.9 5.2 5.5.2-4.3 3.4 1.5 5.3-4.6-3.1-4.6 3.1 1.5-5.3-4.3-3.4 5.5-.2z"/>

          <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>

        </svg>
        <span>English</span>

</div>

<!-- ================= MENÜ ================= -->
<div id="app" aria-hidden="true">
  <div class="wrap" style="padding-bottom:0">
    <header>
      <div class="logo-wrap" data-logo></div>
      <div class="h-name" data-shop-name></div>
      <div class="h-sub" data-shop-sub></div>
      <nav class="langs" aria-label="Language">
        <button data-set="nl">NL</button>
        <button data-set="fr">FR</button>
        <button data-set="tr">TR</button>
        <button data-set="en">EN</button>
      </nav>
    </header>
  </div>

  <nav class="tabs" aria-label="Menu"><div class="tabs-in" id="tabs"></div></nav>

  <main class="wrap" id="menu"></main>

  <footer class="wrap" id="foot"></footer>
</div>

<script>
/* ÜRÜN FOTOĞRAFLARI — img/ klasöründe. Ürün id'si → fotoğraf.
   Aynı fotoğraf birden fazla ürüne atanabilir (ör. hasır künefeler). */
const PHOTOS = {
 "p4442": "img/ezmeli-dondurma.jpg",
 "p4446": "img/burma-kadayif.jpg",
 "p4448": "img/peynirli-kunefe.jpg",
 "p4450": "img/yari-yari-peynirli.jpg",
 "p4452": "img/peynirli-hasir-kunefe.jpg",

 "p4456": "img/san-sebastian-fistikli.jpg",
 "p4500": "img/sutlu-sade-dondurma.jpg",
 "p4502": "img/fistikli-dondurma.jpg",
 "p4504": "img/cikolatali-dondurma.jpg",
 "p4506": "img/sutlac.jpg",
 "p4509": "img/kup-dondurma.jpg",
 "p4511": "img/duz-kadayif.jpg",
 "p4513": "img/toz-fistikli-belluriye.jpg",
 "p4515": "img/iri-fistikli-belluriye.jpg",
 "p481": "img/soguk-baklava.jpg",
 "p482": "img/bohca.jpg",
 "p483": "img/sobiyet.jpg",
 "p484": "img/sarma.jpg",
 "p485": "img/cevizli-baklava.jpg",
 "p486": "img/fistikli-baklava.jpg",
 "p487": "img/hasir-kadayif.jpg",
 "p488": "img/kup-kadayif.jpg"
};
const IMG_OF = {
 "ezmeli-dondurma": "p4442",
 "burma-kadayif": "p4446",
 "peynirli-kunefe": "p4448",
 "yari-yari-peynirli": "p4450",
 "yari-yari-kaymakli": "p4450",
 "peynirli-hasir-kunefe": "p4452",
 "kaymakli-hasir-kunefe": "p4452",
 "san-sebastian-sade": "p4454",
 "san-sebastian-fistikli": "p4456",
 "sutlu-sade-dondurma": "p4500",
 "fistikli-dondurma": "p4502",
 "cikolatali-dondurma": "p4504",
 "sutlac": "p4506",
 "kup-dondurma": "p4509",
 "duz-kadayif": "p4511",
 "toz-fistikli-belluriye": "p4513",
 "iri-fistikli-belluriye": "p4515",
 "soguk-baklava": "p481",
 "bohca": "p482",
 "sobiyet": "p483",
 "sarma": "p484",
 "cevizli-baklava": "p485",
 "fistikli-baklava": "p486",
 "hasir-kadayif": "p487",
 "kup-kadayif": "p488"
};

<script>
const T = {
  pers:    {tr:"kişilik", fr:"pers.", nl:"pers.", en:"pers."},
  sizes:   {tr:"kişilik", fr:"personnes", nl:"personen", en:"people"},
  sold:    {tr:"Tükendi", fr:"Épuisé", nl:"Uitverkocht", en:"Sold out"},
  wa:      {tr:"WhatsApp'tan yazın", fr:"Écrivez-nous sur WhatsApp", nl:"Stuur ons een WhatsApp", en:"Message us on WhatsApp"},
};
const root = document.documentElement;
let LANG = "nl";

const fmt = n => n.toLocaleString('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const tx  = v => v == null ? null : (typeof v === "string" ? v : (v[LANG] ?? null));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- dükkan bilgileri ---------- */
function mono(ch){ return `<span class="mono">${esc((ch||SHOP.name).charAt(0))}</span>`; }
document.querySelectorAll('[data-logo]').forEach(el=>{
  if(!SHOP.logo){ el.innerHTML = mono(); return; }
  /* logo ana klasörde de img/ içinde de olabilir, jpg ya da png */
  const tries = [SHOP.logo, "img/logo.jpg", "logo.png", "img/logo.png", "logo.jpeg", "img/logo.jpeg"];
  let i = 0;
  const img = new Image(); img.alt = SHOP.name;
  img.onerror = () => { i++; if(i < tries.length) img.src = tries[i]; else el.innerHTML = mono(); };
  img.onload = () => el.classList.add('has-img');
  img.src = tries[0];
  el.appendChild(img);
});
document.querySelectorAll('[data-shop-name]').forEach(el=> el.textContent = SHOP.name);
document.querySelectorAll('[data-shop-sub]').forEach(el=> el.textContent = SHOP.sub);
document.querySelectorAll('[data-shop-city]').forEach(el=> el.textContent = "Gaziantep  ·  " + SHOP.city);

/* ---------- kadayıf telleri (açılış ekranı arka planı) ---------- */
document.querySelectorAll('.strands').forEach((svg,k)=>{
  let d = "";
  for(let i=0;i<22;i++){
    const y = 20 + i*7 + (k*3);
    const a = 6 + (i%5)*2, f = 0.018 + (i%3)*0.004, ph = i*0.9;
    let p = `M-10 ${y}`;
    for(let x=0;x<=420;x+=10){ p += ` L${x} ${(y + Math.sin(x*f+ph)*a).toFixed(1)}`; }
    d += `<path d="${p}" opacity="${(0.35 + (i%4)*0.18).toFixed(2)}"/>`;
  }
  svg.innerHTML = d;
});

/* ---------- menü çizimi ---------- */
function thumb(it){
  return `<div class="thumb">${it.img ? `<img src="${it.img}" alt="${esc(tx(it.name))}" loading="lazy">` : mono(tx(it.name))}</div>`;
}
function sizesHTML(prices){
  const keys = Object.keys(prices).map(Number).sort((a,b)=>a-b);
  const anyPrice = keys.some(k => prices[k] != null);
  if(!anyPrice){
    return `<div class="sizes bare">${keys.join(" · ")} ${T.sizes[LANG]}</div>`;
  }
  return `<div class="sizes">${keys.map(k=>`<div class="size"><span><b>${k}</b>${T.pers[LANG]}</span>${prices[k]!=null?`<i>${fmt(prices[k])}</i>`:""}</div>`).join("")}</div>`;
}
function card(it){
  const name = tx(it.name), desc = it.desc ? tx(it.desc) : null, badge = it.badge ? tx(it.badge) : null;
  const src = it.img || (IMG_OF[it.id] ? PHOTOS[IMG_OF[it.id]] : null);
  const tag = it.soldOut ? `<span class="sold-tag">${T.sold[LANG]}</span>` : (badge ? `<span class="badge">${esc(badge)}</span>` : "");
  return `<article class="card${it.soldOut?' sold':''}" data-id="${it.id}">
    <div class="thumb">${src ? `<img src="${src}" alt="${esc(name)}" width="560" height="560" loading="lazy" decoding="async">` : mono(name)}${tag}</div>
    <div class="info">
      <h3 class="name">${esc(name)}</h3>
      ${desc ? `<p class="desc">${esc(desc)}</p>` : ""}
      ${it.prices ? sizesHTML(it.prices) : ""}
      ${it.price!=null ? `<span class="price">${fmt(it.price)}</span>` : ""}
    </div>
  </article>`;
}
function row(it){
  return `<div class="row${it.soldOut?' sold':''}" data-id="${it.id}">
    <span class="name">${esc(tx(it.name))}</span>
    ${it.soldOut ? `<span class="sold-tag">${T.sold[LANG]}</span>` : ""}
    <span class="dots"></span>
    <span class="price">${it.price!=null ? fmt(it.price) : "&nbsp;"}</span>
  </div>`;
}
function render(){
  document.getElementById('tabs').innerHTML =
    MENU.map(c=>`<button class="tab" data-go="${c.id}">${esc(tx(c.title))}</button>`).join("");
  document.getElementById('menu').innerHTML = MENU.map(c=>`
    <section id="${c.id}">
      <h2 class="sec-title">${esc(tx(c.title))}</h2>
      ${c.note ? `<p class="sec-note">${esc(tx(c.note))}</p>` : ""}
      <div class="${c.layout==="list" ? "list" : "grid"}">${c.items.map(c.layout==="list" ? row : card).join("")}</div>
    </section>`).join("");

  const f = [];
  f.push(`<div class="foot-rule"></div>${esc(SHOP.name)} · ${esc(SHOP.city)}`);
  if(SHOP.address) f.push(esc(SHOP.address));
  const links = [];
  if(SHOP.phone)     links.push(`<a href="tel:${SHOP.phone.replace(/\s/g,'')}">${esc(SHOP.phone)}</a>`);
  if(SHOP.whatsapp)  links.push(`<a href="https://wa.me/${SHOP.whatsapp}">WhatsApp</a>`);
  if(SHOP.instagram) links.push(`<a href="${SHOP.instagram}">Instagram</a>`);
  if(SHOP.tiktok)    links.push(`<a href="${SHOP.tiktok}">TikTok</a>`);
  if(links.length) f.push(links.join(" · "));
  if(SHOP.hours) f.push(`<span style="font-size:12px">${esc(tx(SHOP.hours))}</span>`);
  document.getElementById('foot').innerHTML = f.join("<br>");

  document.querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=>{
    document.getElementById(b.dataset.go).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  }));
  spy();
}

/* ---------- hangi kategoride olduğunu sekmede göster ---------- */
let obs;
function spy(){
  if(obs) obs.disconnect();
  obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      document.querySelectorAll('.tab').forEach(t=>{
        const on = t.dataset.go === e.target.id;
        t.classList.toggle('on', on);
        if(on && !t.classList.contains('was-on')){
          const strip = t.parentElement;
          strip.scrollTo({left: t.offsetLeft - (strip.clientWidth - t.offsetWidth)/2, behavior:'smooth'});
        }
        t.classList.toggle('was-on', on);
      });
    });
  }, {rootMargin:"-12% 0px -75% 0px"});
  document.querySelectorAll('#menu section').forEach(s=>obs.observe(s));
}

/* ---------- dil ---------- */
function warmImages(){
  Object.values(PHOTOS).forEach(u=>{ const i=new Image(); i.src=u; if(i.decode) i.decode().catch(()=>{}); });
}
function setLang(l){
  LANG = l;
  root.dataset.lang = l; root.lang = l;
  document.querySelectorAll('.langs button').forEach(b=> b.classList.toggle('active', b.dataset.set === l));
  render();
}
document.querySelectorAll('.langs button').forEach(b=> b.addEventListener('click', ()=> setLang(b.dataset.set)));

/* ---------- bayrağa dokununca menü açılır ---------- */
document.querySelectorAll('.flag').forEach(b=> b.addEventListener('click', ()=>{
  b.classList.add('picked');
  setLang(b.dataset.pick);
  const splash = document.getElementById('splash'), app = document.getElementById('app');
  setTimeout(()=>{
    splash.classList.add('out');
    app.classList.add('in'); app.removeAttribute('aria-hidden');
    document.body.classList.remove('locked');
    window.scrollTo(0,0);
    setTimeout(()=> splash.remove(), 800);
  }, 180);
}));

/* telefon diline göre bayrağı öne çıkar (ekran yine gösterilir) */
const nav = (navigator.language||"nl").slice(0,2).toLowerCase();
setLang(["tr","fr","nl","en"].includes(nav) ? nav : "nl");
</script>
