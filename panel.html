<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3E2723">
<title>Personel Paneli — Çavuşzade Antwerpen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="supabase-config.js"></script>
<style>
  :root{
    --cream:#FFF8E7; --bej:#F5E6D3; --gold:#D4AF37; --gold-deep:#B8941F;
    --brown:#3E2723; --brown-mid:#6D4C41; --line:rgba(62,39,35,.14);
    --red:#B3261E; --red-bg:#FBE9E7; --green:#2E7D32;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Figtree',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--brown);
       -webkit-font-smoothing:antialiased;min-height:100vh}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  .serif{font-family:'Cormorant Garamond',Georgia,serif}
  [hidden]{display:none!important}

  /* ---------- PIN ekranı ---------- */
  #lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
  #lock h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;line-height:1}
  #lock .sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);margin-top:8px;font-weight:600}
  .dots{display:flex;gap:16px;margin:34px 0 10px}
  .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brown-mid);transition:background .15s,transform .15s}
  .dots i.on{background:var(--brown);border-color:var(--brown)}
  .dots.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #lockMsg{min-height:20px;font-size:14px;color:var(--red);font-weight:600}
  .pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:14px}
  .pad button{height:76px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:28px;font-weight:600}
  .pad button:active{background:var(--bej);transform:scale(.95)}
  .pad .ghost{background:none;border:none;font-size:15px;color:var(--brown-mid)}

  /* ---------- Panel ---------- */
  header{position:sticky;top:0;z-index:10;background:var(--brown);color:var(--cream);
         padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
  .hrow{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .htitle{flex:1;min-width:0}
  .htitle b{display:block;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;line-height:1.05}
  .htitle span{font-size:13px;opacity:.8}
  .hbtn{padding:9px 13px;border-radius:999px;border:1px solid rgba(255,248,231,.35);font-size:13px;font-weight:600;color:var(--cream)}
  .count{max-width:640px;margin:10px auto 0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .count .pill{background:var(--gold);color:var(--brown);border-radius:999px;padding:3px 11px;font-weight:700}
  .count .pill.zero{background:rgba(255,248,231,.18);color:var(--cream)}
  .sync{margin-left:auto;font-size:12px;font-weight:500;opacity:.75}

  main{max-width:640px;margin:0 auto;padding:6px 16px calc(110px + env(safe-area-inset-bottom,0px))}
  h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;margin:24px 2px 8px;display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;min-height:64px;
        border-bottom:1px solid var(--line);transition:background .15s}
  .item:last-child{border-bottom:none}
  .item:active{background:var(--bej)}
  .item .nm{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.25}
  .item .st{display:block;font-size:12.5px;font-weight:600;color:var(--green);margin-top:2px}
  .item.sold{background:var(--red-bg)}
  .item.sold .nm{color:var(--red)}
  .item.sold .st{color:var(--red)}
  .item.busy{opacity:.55;pointer-events:none}

  /* anahtar */
  .sw{position:relative;flex-shrink:0;width:58px;height:34px;border-radius:999px;background:var(--green);transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:27px;width:28px;height:28px;border-radius:50%;background:#fff;
             box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
  .item.sold .sw{background:var(--red)}
  .item.sold .sw::after{left:3px}

  .foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--cream) 30%);
        padding:22px 16px calc(14px + env(safe-area-inset-bottom,0px))}
  .reset{display:block;width:100%;max-width:640px;margin:0 auto;padding:16px;border-radius:14px;
         background:#fff;border:1.5px solid var(--brown);font-weight:700;font-size:15px}
  .reset.confirm{background:var(--brown);color:var(--cream)}
  .reset:disabled{opacity:.4}

  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
         background:var(--brown);color:var(--cream);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
         opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--red)}

  .cfg{max-width:640px;margin:20px auto 0;padding:14px 16px;border-radius:12px;background:var(--red-bg);color:var(--red);font-size:14px;font-weight:600}
</style>
</head>
<body>

<!-- ============ PIN ============ -->
<section id="lock">
  <h1>Çavuşzade</h1>
  <div class="sub">Personel paneli</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div id="lockMsg" role="status"></div>
  <div class="pad" id="pad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button class="ghost" data-k="clr">Sil</button><button>0</button><button class="ghost" data-k="back">⌫</button>
  </div>
</section>

<!-- ============ PANEL ============ -->
<div id="panel" hidden>
  <header>
    <div class="hrow">
      <div class="htitle"><b>Tükendi paneli</b><span>Dokun → tükendi / tekrar var</span></div>
      <button class="hbtn" id="refresh">Yenile</button>
      <button class="hbtn" id="logout">Çıkış</button>
    </div>
    <div class="count"><span class="pill" id="pill">0</span><span id="countTxt">ürün tükendi</span><span class="sync" id="sync"></span></div>
  </header>
  <div class="cfg" id="cfgWarn" hidden>Supabase ayarı eksik: supabase-config.js dosyasına URL ve anahtar girilmeli.</div>
  <main id="list"></main>
  <div class="foot"><button class="reset" id="reset">Hepsini tekrar “var” yap</button></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* Menü index.html'den okunur, böylece menüye ürün eklenince panel de kendiliğinden günceller.
   Okunamazsa aşağıdaki yedek liste kullanılır. */
const FALLBACK = [{"id":"kunefe","title":"Künefeler","items":[{"id":"peynirli-kunefe","name":"Peynirli Künefe"},{"id":"hasir-kunefe","name":"Hasır Künefe"},{"id":"yari-fistikli-yari-belluriye","name":"Yarı Fıstıklı Yarı Belluriye"},{"id":"mozaik-kunefe","name":"Mozaik Künefe"}]},{"id":"kadayif","title":"Porsiyon Kadayıflar","items":[{"id":"burma-kadayif","name":"Burma Kadayıf"},{"id":"fistikli-belluriye","name":"Fıstıklı Belluriye"},{"id":"soguk-hasir","name":"Soğuk Hasır"},{"id":"kup-kadayif","name":"Küp Kadayıf"}]},{"id":"sutlu","title":"Sütlü Tatlılar","items":[{"id":"firin-sutlac","name":"Fırın Sütlaç"},{"id":"san-sebastian-sade","name":"San Sebastian"},{"id":"san-sebastian-fistikli","name":"San Sebastian Fıstıklı"},{"id":"dubai-cup","name":"Dubai Cup"},{"id":"soguk-baklava","name":"Soğuk Baklava"}]},{"id":"dondurma","title":"Dondurmalar","items":[{"id":"ezmeli-dondurma","name":"Ezmeli Dondurma"},{"id":"kup-dondurma","name":"Küp Dondurma"},{"id":"sutlu-sade-dondurma","name":"Sütlü Sade Dondurma"},{"id":"fistikli-dondurma","name":"Fıstıklı Dondurma"},{"id":"cikolatali-dondurma","name":"Çikolatalı Dondurma"}]},{"id":"soguk-icecek","title":"Soğuk İçecekler","items":[{"id":"cola","name":"Coca-Cola"},{"id":"cola-zero","name":"Coca-Cola Zero"},{"id":"fanta","name":"Fanta"},{"id":"lipton-ice-tea","name":"Lipton Ice Tea"},{"id":"fuze-tea","name":"Fuze Tea"},{"id":"chaudfontaine","name":"Chaudfontaine"},{"id":"red-bull","name":"Red Bull"}]},{"id":"sicak","title":"Sıcak İçecekler","items":[{"id":"cay","name":"Çay"},{"id":"kahve","name":"Kahve"},{"id":"espresso","name":"Espresso"}]},{"id":"soguk-kahve","title":"Soğuk Kahveler","items":[{"id":"ice-matcha-latte","name":"Ice Matcha Latte (çilek / mango)"},{"id":"ice-cappuccino","name":"Ice Cappuccino"}]}];

const C = window.SUPA || {};
const READY = C.URL && !String(C.URL).startsWith("BURAYA") && C.ANON_KEY && !String(C.ANON_KEY).startsWith("BURAYA");
const BASE = READY ? C.URL.replace(/\/$/,"") : "";
const H = {apikey:C.ANON_KEY, Authorization:"Bearer "+C.ANON_KEY, "Content-Type":"application/json"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let PIN = "", CATS = FALLBACK, SOLD = {};
const store = {
  get(){ try{ return localStorage.getItem("cz_pin") || ""; }catch(e){ return ""; } },
  set(v){ try{ v ? localStorage.setItem("cz_pin", v) : localStorage.removeItem("cz_pin"); }catch(e){} }
};

/* ---------- küçük yardımcılar ---------- */
let toastT;
function toast(msg, err){
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove("show"), err ? 3200 : 1600);
}
async function rpc(fn, body){
  const r = await fetch(`${BASE}/rest/v1/rpc/${fn}`, {method:"POST", headers:H, body:JSON.stringify(body)});
  if(!r.ok){
    let m = ""; try{ m = (await r.json()).message || ""; }catch(e){}
    throw new Error(m.includes("PIN") ? "PIN" : (m || "HTTP "+r.status));
  }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}

/* ---------- menüyü index.html'den oku ---------- */
async function loadMenu(){
  try{
    const html = await (await fetch("index.html", {cache:"no-store"})).text();
    const m = html.match(/const MENU = (\[[\s\S]*?\n\]);\s*<\/script>/);
    if(!m) return;
    const MENU = new Function("return " + m[1])();
    const nm = n => typeof n === "string" ? n : (n.tr || n.nl || n.en);
    const cats = MENU.map(c => ({id:c.id, title:nm(c.title), items:c.items.map(i => ({id:i.id, name:nm(i.name)}))}));
    if(cats.length && cats.every(c => c.items.length)) CATS = cats;
  }catch(e){ /* yedek liste kalır */ }
}

/* ---------- durum ---------- */
async function loadSold(){
  const r = await fetch(`${BASE}/rest/v1/sold_out?select=id,sold`, {headers:H, cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  SOLD = {}; (await r.json()).forEach(x => { if(x.sold) SOLD[x.id] = true; });
  const d = new Date();
  $("sync").textContent = "güncel · " + d.toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});
}

function draw(){
  $("list").innerHTML = CATS.map(c => `
    <h2>${esc(c.title)}</h2>
    <div class="list">${c.items.map(it => `
      <button class="item${SOLD[it.id] ? " sold" : ""}" data-id="${esc(it.id)}" role="switch" aria-checked="${SOLD[it.id] ? "true" : "false"}">
        <span class="nm">${esc(it.name)}<span class="st">${SOLD[it.id] ? "TÜKENDİ" : "Var"}</span></span>
        <span class="sw" aria-hidden="true"></span>
      </button>`).join("")}
    </div>`).join("");
  counts();
}
function counts(){
  const ids = new Set(CATS.flatMap(c => c.items.map(i => i.id)));
  const n = Object.keys(SOLD).filter(id => ids.has(id)).length;
  $("pill").textContent = n; $("pill").classList.toggle("zero", n === 0);
  $("countTxt").textContent = n === 0 ? "her şey var" : "ürün tükendi";
  $("reset").disabled = n === 0;
}
function paintItem(el, sold){
  el.classList.toggle("sold", sold);
  el.setAttribute("aria-checked", sold ? "true" : "false");
  el.querySelector(".st").textContent = sold ? "TÜKENDİ" : "Var";
}

/* ---------- dokun → değiştir ---------- */
$("list").addEventListener("click", async e => {
  const el = e.target.closest(".item"); if(!el) return;
  const id = el.dataset.id, next = !SOLD[id], name = el.querySelector(".nm").firstChild.textContent;
  // hemen göster, sunucu reddederse geri al
  next ? SOLD[id] = true : delete SOLD[id];
  paintItem(el, next); counts(); el.classList.add("busy");
  try{
    await rpc("panel_set", {p_pin:PIN, p_id:id, p_sold:next});
    toast(next ? `${name}: tükendi` : `${name}: tekrar var`);
  }catch(err){
    next ? delete SOLD[id] : SOLD[id] = true;
    paintItem(el, !next); counts();
    if(err.message === "PIN"){ logout("PIN değişmiş, tekrar giriş yapın"); return; }
    toast("Kaydedilemedi — internet bağlantısını kontrol edin", true);
  }finally{ el.classList.remove("busy"); }
});

/* ---------- hepsini aç (iki dokunuş: yanlışlıkla basılmasın) ---------- */
let resetArm;
$("reset").addEventListener("click", async () => {
  const b = $("reset");
  if(!b.classList.contains("confirm")){
    b.classList.add("confirm"); b.textContent = "Emin misin? Tekrar dokun";
    clearTimeout(resetArm);
    resetArm = setTimeout(()=>{ b.classList.remove("confirm"); b.textContent = "Hepsini tekrar “var” yap"; }, 3500);
    return;
  }
  clearTimeout(resetArm);
  b.classList.remove("confirm"); b.textContent = "Hepsini tekrar “var” yap"; b.disabled = true;
  try{ await rpc("panel_reset", {p_pin:PIN}); SOLD = {}; draw(); toast("Tüm ürünler tekrar var"); }
  catch(err){ if(err.message === "PIN"){ logout("PIN değişmiş, tekrar giriş yapın"); return; } toast("Olmadı — tekrar deneyin", true); counts(); }
});

async function refresh(quiet){
  try{ await loadSold(); draw(); if(!quiet) toast("Güncellendi"); }
  catch(e){ if(!quiet) toast("Bağlanılamadı", true); }
}
$("refresh").addEventListener("click", () => refresh(false));
document.addEventListener("visibilitychange", () => { if(!document.hidden && !$("panel").hidden) refresh(true); });
setInterval(() => { if(!document.hidden && !$("panel").hidden) refresh(true); }, 30000);
/* başka telefondan yapılan değişiklikler de anında gelsin */
if(READY && window.SUPA.live) window.SUPA.live(() => { if(!$("panel").hidden) refresh(true); });

/* ---------- giriş ---------- */
let typed = "";
function dots(){ [...$("dots").children].forEach((d,i) => d.classList.toggle("on", i < typed.length)); }
$("pad").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  const k = b.dataset.k;
  if(k === "clr") typed = "";
  else if(k === "back") typed = typed.slice(0,-1);
  else if(typed.length < 4) typed += b.textContent;
  $("lockMsg").textContent = ""; dots();
  if(typed.length === 4) tryLogin(typed);
});
async function tryLogin(pin){
  if(!READY){ $("lockMsg").textContent = "Supabase ayarı eksik"; return; }
  $("lockMsg").textContent = "Kontrol ediliyor…";
  try{
    const ok = await rpc("panel_check", {p_pin:pin});
    if(ok){ PIN = pin; store.set(pin); enter(); }
    else { fail("PIN yanlış"); }
  }catch(e){ fail("Bağlanılamadı"); }
}
function fail(msg){
  $("lockMsg").textContent = msg; typed = ""; dots();
  $("dots").classList.remove("shake"); void $("dots").offsetWidth; $("dots").classList.add("shake");
}
async function enter(){
  $("lock").hidden = true; $("panel").hidden = false;
  draw();
  try{ await loadSold(); }catch(e){ toast("Durum okunamadı", true); }
  draw();
}
function logout(msg){
  PIN = ""; typed = ""; store.set(""); dots();
  $("panel").hidden = true; $("lock").hidden = false;
  $("lockMsg").textContent = msg || "";
}
$("logout").addEventListener("click", () => logout());

/* ---------- başlat ---------- */
(async () => {
  if(!READY) $("cfgWarn").hidden = false;
  await loadMenu();
  const saved = store.get();
  if(saved && READY){
    try{ if(await rpc("panel_check", {p_pin:saved})){ PIN = saved; enter(); return; } }catch(e){}
    store.set("");
  }
})();
</script>
</body>
</html>
